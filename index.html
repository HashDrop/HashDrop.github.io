<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Mobile -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- Basic SEO -->
  <title>HashDrop — Temporary File Uploader</title>

  <meta
    name="description"
    content="A free, no-login temporary file uploader and ChatGPT file bridge."
  >

  <meta
    name="theme-color"
    content="#151515"
  >

  <!-- Canonical -->
  <link
    rel="canonical"
    href="https://hashdrop.github.io/"
  >

  <!-- ========================= -->
  <!-- Open Graph / Social Cards -->
  <!-- ========================= -->

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:title"
    content="HashDrop — Temporary File Uploader"
  >

  <meta
    property="og:description"
    content="A free, no-login temporary file uploader and ChatGPT file bridge."
  >

  <meta
    property="og:url"
    content="https://hashdrop.github.io/"
  >

  <meta
    property="og:site_name"
    content="HashDrop"
  >

  <!-- PUT YOUR 1280x640 BANNER URL HERE -->
  <meta
    property="og:image"
    content="https://raw.githubusercontent.com/HashDrop/HashDrop.github.io/refs/heads/main/HashDrop_banner.png"
  >

  <meta
    property="og:image:width"
    content="1280"
  >

  <meta
    property="og:image:height"
    content="640"
  >

  <meta
    property="og:image:alt"
    content="HashDrop — Temporary File Uploader"
  >

  <!-- ========================= -->
  <!-- Twitter / X Card -->
  <!-- ========================= -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="HashDrop — Temporary File Uploader"
  >

  <meta
    name="twitter:description"
    content="A free, no-login temporary file uploader and ChatGPT file bridge."
  >

  <meta
    name="twitter:image"
    content="https://raw.githubusercontent.com/HashDrop/HashDrop.github.io/refs/heads/main/HashDrop_banner.png"
  >

  <meta
    name="twitter:image:alt"
    content="HashDrop — Temporary File Uploader"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #151515;
      color: #ffffff;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 760px;

      padding: 40px 24px;

      text-align: center;
    }

    /* =========================
       Logo
       ========================= */

    .logo-link {
      display: inline-block;

      text-decoration: none;

      margin-bottom: 48px;
    }

    .logo {
      width: 150px;
      height: 150px;

      display: block;

      object-fit: contain;

      border-radius: 24px;

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .logo-link:hover .logo {
      transform: translateY(-3px);
      opacity: 0.92;
    }

    /* =========================
       Heading
       ========================= */

    h1 {
      margin: 0 0 20px;

      font-size: clamp(34px, 6vw, 58px);

      line-height: 1.08;

      font-weight: 750;

      letter-spacing: -2px;
    }

    h1 span {
      color: #1464ff;
    }

    /* =========================
       Description
       ========================= */

    .description {
      max-width: 620px;

      margin: 0 auto 38px;

      color: #a9a9a9;

      font-size: 18px;

      line-height: 1.6;
    }

    /* =========================
       Button
       ========================= */

    .button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 12px;

      min-width: 280px;

      padding: 17px 30px;

      background: #1464ff;

      color: #ffffff;

      border-radius: 13px;

      text-decoration: none;

      font-size: 18px;

      font-weight: 650;

      box-shadow:
        0 8px 30px rgba(20, 100, 255, 0.22);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .button:hover {
      background: #0d5bf0;

      transform: translateY(-2px);

      box-shadow:
        0 12px 38px rgba(20, 100, 255, 0.32);
    }

    .button:active {
      transform: translateY(0);
    }

    /* =========================
       External Link Icon
       ========================= */

    .icon {
      width: 21px;
      height: 21px;

      fill: none;

      stroke: currentColor;

      stroke-width: 2;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================
       Countdown
       ========================= */

    .countdown {
      margin-top: 32px;

      color: #707070;

      font-size: 15px;
    }

    /* =========================
       Mobile
       ========================= */

    @media (max-width: 600px) {

      .container {
        padding: 32px 20px;
      }

      .logo {
        width: 115px;
        height: 115px;

        border-radius: 18px;
      }

      .logo-link {
        margin-bottom: 38px;
      }

      h1 {
        font-size: 36px;

        letter-spacing: -1.2px;
      }

      .description {
        font-size: 16px;
      }

      .button {
        width: 100%;

        min-width: 0;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- HashDrop Logo -->
    <a
      class="logo-link"
      href="https://hashdrop.hailongcoding-hashdrop.workers.dev/"
      aria-label="Go to HashDrop"
    >
      <img
        class="logo"
        src="https://avatars.githubusercontent.com/u/325260491?v=4"
        alt="HashDrop"
      >
    </a>


    <!-- Main Heading -->
    <h1>
      Redirecting to <span>HashDrop</span>
    </h1>


    <!-- Description -->
    <p class="description">
      You are being redirected to the HashDrop environment.
    </p>


    <!-- Manual Redirect -->
    <a
      class="button"
      href="https://hashdrop.hailongcoding-hashdrop.workers.dev/"
    >

      <svg
        class="icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M14 3h7v7"></path>
        <path d="M10 14L21 3"></path>
        <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path>
      </svg>

      Go to HashDrop

    </a>


    <!-- Countdown -->
    <div class="countdown">
      Redirecting in
      <span id="seconds">2</span>
      seconds...
    </div>

  </main>


  <script>
    const redirectURL =
      "https://hashdrop.hailongcoding-hashdrop.workers.dev/";

    let seconds = 2;

    const secondsElement =
      document.getElementById("seconds");

    const timer = setInterval(() => {

      seconds--;

      if (seconds <= 0) {

        clearInterval(timer);

        secondsElement.textContent = "0";

        window.location.href = redirectURL;

      } else {

        secondsElement.textContent = seconds;

      }

    }, 1000);
  </script>

</body>
</html>
