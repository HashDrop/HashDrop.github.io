<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Verifying — HashDrop</title>

  <meta
    name="theme-color"
    content="#151515"
  >

  <!-- HashDrop Icon -->
  <link
    rel="icon"
    type="image/png"
    href="https://raw.githubusercontent.com/HashDrop/HashDrop.github.io/refs/heads/main/HashDrop_icon.png"
  >

  <link
    rel="apple-touch-icon"
    href="https://raw.githubusercontent.com/HashDrop/HashDrop.github.io/refs/heads/main/HashDrop_icon.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #151515;
      color: #ffffff;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 520px;

      padding: 40px 24px;

      text-align: center;
    }

    /* Logo */

    .logo {
      width: 100px;
      height: 100px;

      object-fit: contain;

      display: block;

      margin: 0 auto 38px;

      border-radius: 20px;
    }

    /* Heading */

    h1 {
      margin: 0 0 12px;

      font-size: 30px;

      line-height: 1.2;

      font-weight: 700;

      letter-spacing: -0.6px;
    }

    /* Description */

    .description {
      margin: 0;

      color: #8f8f8f;

      font-size: 16px;

      line-height: 1.5;
    }

    /* Verification box */

    .verification {
      margin: 34px auto 0;

      width: 100%;
      max-width: 390px;

      padding: 18px 20px;

      display: flex;

      align-items: center;

      gap: 15px;

      text-align: left;

      background: #1b1b1b;

      border: 1px solid #292929;

      border-radius: 12px;
    }

    /* Spinner */

    .spinner {
      width: 22px;
      height: 22px;

      flex-shrink: 0;

      border: 2px solid #333333;

      border-top-color: #1464ff;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .status {
      font-size: 14px;

      color: #b5b5b5;
    }

    .status strong {
      display: block;

      margin-bottom: 3px;

      color: #ffffff;

      font-size: 15px;
    }

    /* Progress */

    .progress {
      width: 100%;
      max-width: 390px;

      height: 3px;

      margin: 20px auto 0;

      overflow: hidden;

      background: #242424;

      border-radius: 10px;
    }

    .progress-bar {
      width: 0%;

      height: 100%;

      background: #1464ff;

      border-radius: 10px;

      transition: width 0.5s ease;
    }

    /* Bottom text */

    .redirect {
      margin-top: 24px;

      color: #606060;

      font-size: 13px;
    }

    /* Mobile */

    @media (max-width: 600px) {

      .container {
        padding: 30px 20px;
      }

      .logo {
        width: 82px;
        height: 82px;

        margin-bottom: 32px;
      }

      h1 {
        font-size: 27px;
      }

      .description {
        font-size: 15px;
      }

      .verification {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- HashDrop Logo -->
    <img
      class="logo"
      src="https://raw.githubusercontent.com/HashDrop/HashDrop.github.io/refs/heads/main/HashDrop_icon.png"
      alt="HashDrop"
    >

    <!-- Heading -->
    <h1 id="title">
      Verifying your browser
    </h1>

    <p
      class="description"
      id="description"
    >
      Please wait while we prepare HashDrop.
    </p>

    <!-- Verification Status -->
    <div class="verification">

      <div
        class="spinner"
        id="spinner"
      ></div>

      <div class="status">

        <strong id="statusTitle">
          Checking browser
        </strong>

        <span id="statusText">
          Preparing your connection...
        </span>

      </div>

    </div>

    <!-- Progress -->
    <div class="progress">

      <div
        class="progress-bar"
        id="progressBar"
      ></div>

    </div>

    <!-- Countdown -->
    <div
      class="redirect"
      id="redirectText"
    >
      Redirecting to HashDrop...
    </div>

  </main>


  <script>

    const HASHDROP_URL =
      "https://hashdrop.hailongcoding-hashdrop.workers.dev/";

    const title =
      document.getElementById("title");

    const description =
      document.getElementById("description");

    const statusTitle =
      document.getElementById("statusTitle");

    const statusText =
      document.getElementById("statusText");

    const spinner =
      document.getElementById("spinner");

    const progressBar =
      document.getElementById("progressBar");

    const redirectText =
      document.getElementById("redirectText");


    /*
     * Lightweight browser check.
     *
     * This checks that JavaScript is running and
     * that the browser has a normal document environment.
     */

    const browserReady =
      typeof window !== "undefined" &&
      typeof document !== "undefined";


    if (!browserReady) {

      statusTitle.textContent =
        "Browser check failed";

      statusText.textContent =
        "Please enable JavaScript.";

    } else {

      /* Step 1 */

      setTimeout(() => {

        progressBar.style.width = "35%";

        statusTitle.textContent =
          "Checking browser";

        statusText.textContent =
          "Browser environment detected.";

      }, 400);


      /* Step 2 */

      setTimeout(() => {

        progressBar.style.width = "70%";

        statusTitle.textContent =
          "Connection ready";

        statusText.textContent =
          "Preparing HashDrop...";

      }, 900);


      /* Step 3 */

      setTimeout(() => {

        progressBar.style.width = "100%";

        spinner.style.display =
          "none";

        statusTitle.textContent =
          "Verification complete";

        statusText.textContent =
          "Taking you to HashDrop.";

        redirectText.textContent =
          "Redirecting...";

      }, 1400);


      /* Redirect */

      setTimeout(() => {

        window.location.replace(
          HASHDROP_URL
        );

      }, 1900);

    }

  </script>

</body>
</html>
